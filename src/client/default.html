<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>New canvas</title>
        <style>
            :root {
                color-scheme: dark;
            }
            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                background: #0e1116;
                color: #e6e6e6;
            }
            main {
                max-width: 36rem;
                padding: 2rem;
            }
            h1 {
                font-size: 1.6rem;
                margin: 0 0 0.5rem;
            }
            p {
                line-height: 1.6;
                color: #9aa3af;
            }
            code {
                background: #1a2029;
                padding: 0.1rem 0.35rem;
                border-radius: 4px;
            }
        </style>
    </head>
    <body>
        <main>
            <h1>The canvas is yours</h1>
            <p>
                This page is edited live by an assistant. Type a request in the bar
                below — <em>“make the heading bigger”, “add a counter button”</em> — and
                watch the page rewrite itself.
            </p>
            <p>
                Every change is saved against this page&apos;s id, so the same address
                always shows the latest version.
            </p>
        </main>
    </body>
</html>
