<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>canvas</title>
    </head>
    <body>
        <h1>The canvas is yours</h1>
        <div style="display: flex; gap: 0.5rem; margin-bottom: 1rem">
            <input
                id="prompt-in"
                style="flex: 1; padding: 0.25rem"
                value="give me a very brief explanation on vite"
            />
            <button id="edit-btn">Send</button>
        </div>
        <pre
            id="log"
            style="
                background: #111;
                color: #0f0;
                padding: 1rem;
                min-height: 10rem;
                white-space: pre-wrap;
                font-family: monospace;
            "
        ></pre>
        <script>
            const logEl = document.getElementById("log");
            const logLine = (msg) => {
                logEl.textContent += msg + "\n";
                logEl.scrollTop = logEl.scrollHeight;
            };

            document.getElementById("edit-btn").onclick = async () => {
                const btn = document.getElementById("edit-btn");
                const input = document.getElementById("prompt-in");
                btn.disabled = true;
                btn.textContent = "...";
                logEl.textContent = "";
                try {
                    const { canvasChanged } = await FCAgentClient.send(
                        input.value,
                        logLine,
                    );
                    if (canvasChanged) location.reload();
                } catch (err) {
                    logLine("Error: " + err.message);
                    btn.textContent = "Send";
                    btn.disabled = false;
                }
            };
        </script>
    </body>
</html>
